<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D Eyewear Virtual Try-On</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0d0e12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Video flipped horizontally for a natural mirror view */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    /* Three.js canvas placed directly over the video stream */
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Loading overlay */
    #loader-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 14, 18, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      gap: 16px;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Bottom Control Dock */
    #dock {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(20, 24, 33, 0.75);
      backdrop-filter: blur(16px);
      padding: 10px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45);
    }

    .selector-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .selector-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .selector-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }

    .snapshot-btn {
      background: #10b981;
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 6px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .snapshot-btn:hover {
      transform: scale(1.08);
      background: #059669;
    }
  </style>

  <!-- Three.js and GLTFLoader Dependencies -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- Google MediaPipe Tasks Vision -->
  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10";

    // Application state
    let faceLandmarker;
    let video;
    let scene, camera, renderer;
    let headGroup, occluderMesh;
    let glassesContainer;
    const loaderElem = document.getElementById("loader-overlay");

    // Catalog configuration
    const GLASSES_MODELS = [
      {
        id: "classic-wayfarer",
        name: "Wayfarer Black",
        type: "procedural", // Procedural fallback model ready without external assets
        frameColor: 0x111111,
        lensColor: 0x15222e,
        roughness: 0.15,
        transmission: 0.88,
        scale: 1.0,
        offsetY: 0.0,
        offsetZ: 0.35
      },
      {
        id: "aviator-gold",
        name: "Aviator Gold",
        type: "procedural",
        frameColor: 0xd4af37,
        lensColor: 0x223820,
        roughness: 0.05,
        transmission: 0.85,
        scale: 1.04,
        offsetY: -0.05,
        offsetZ: 0.38
      },
      {
        id: "tortoise-round",
        name: "Amber Round",
        type: "procedural",
        frameColor: 0x7c3f1d,
        lensColor: 0x3d2714,
        roughness: 0.3,
        transmission: 0.90,
        scale: 0.96,
        offsetY: 0.02,
        offsetZ: 0.35
      }
    ];

    let currentConfig = GLASSES_MODELS[0];

    // Smoothing vectors for jitter-free tracking
    const smoothPos = new THREE.Vector3();
    const smoothQuat = new THREE.Quaternion();
    const smoothScale = new THREE.Vector3(1, 1, 1);
    let firstDetection = true;

    // 1. Initialize Scene & Depth Occluder
    function initScene() {
      const container = document.getElementById("viewport");
      const canvas = document.getElementById("three-canvas");

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      // Studio Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
      keyLight.position.set(2, 4, 3);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xdbeafe, 1.2);
      fillLight.position.set(-2, -1, 2);
      scene.add(fillLight);

      // Root group driven by facial 6DoF transformation
      headGroup = new THREE.Group();
      scene.add(headGroup);

      // -------------------------------------------------------------
      // Invisible 3D Head Occluder
      // Writes exclusively to the GPU depth buffer (Z-buffer)
      // Any 3D geometry placed behind this volume will be naturally clipped
      // -------------------------------------------------------------
      const headGeo = new THREE.SphereGeometry(1.0, 36, 36);
      headGeo.scale(0.88, 1.15, 1.05); // Standard anthropometric ratio

      const occluderMat = new THREE.MeshStandardMaterial({
        colorWrite: false, // Don't draw pixels to the screen
        depthWrite: true   // Force occluder boundary into depth buffer
      });

      occluderMesh = new THREE.Mesh(headGeo, occluderMat);
      occluderMesh.position.set(0, -0.15, -0.75); // Centered into the skull relative to nose bridge
      occluderMesh.renderOrder = 0; // Rendered first so depth is registered
      headGroup.add(occluderMesh);

      // Eyewear Attachment Anchor
      glassesContainer = new THREE.Group();
      glassesContainer.renderOrder = 1;
      headGroup.add(glassesContainer);

      buildEyewear(currentConfig);
      window.addEventListener("resize", onWindowResize);
    }

    // 2. Eyewear Construction (PBR Metal/Acetate & Physical Glass)
    function buildEyewear(config) {
      while (glassesContainer.children.length > 0) {
        const obj = glassesContainer.children[0];
        glassesContainer.remove(obj);
      }

      const frameGroup = new THREE.Group();

      // Materials
      const frameMaterial = new THREE.MeshStandardMaterial({
        color: config.frameColor,
        roughness: config.roughness,
        metalness: config.id.includes("aviator") ? 0.9 : 0.1,
        clearcoat: 0.6,
        clearcoatRoughness: 0.1
      });

      const lensMaterial = new THREE.MeshPhysicalMaterial({
        color: config.lensColor,
        metalness: 0.0,
        roughness: 0.05,
        transmission: config.transmission,
        ior: 1.52,
        transparent: true,
        opacity: 0.92,
        reflectivity: 0.6
      });

      // Rim Dimensions (Centimeters converted to Three.js metric space)
      const rimRadius = 0.28;
      const rimThickness = 0.025;
      const eyeSeparation = 0.38;

      // Front Bridge
      const bridgeGeo = new THREE.CylinderGeometry(rimThickness * 0.8, rimThickness * 0.8, eyeSeparation, 16);
      bridgeGeo.rotateZ(Math.PI / 2);
      const bridgeMesh = new THREE.Mesh(bridgeGeo, frameMaterial);
      bridgeMesh.position.set(0, 0.04, 0);
      frameGroup.add(bridgeMesh);

      // Left & Right Rims and Lenses
      [-eyeSeparation, eyeSeparation].forEach((xPos) => {
        const rimGeo = new THREE.TorusGeometry(rimRadius, rimThickness, 20, 48);
        const rim = new THREE.Mesh(rimGeo, frameMaterial);
        rim.position.set(xPos, 0, 0);
        frameGroup.add(rim);

        const lensGeo = new THREE.CylinderGeometry(rimRadius - 0.005, rimRadius - 0.005, 0.01, 32);
        lensGeo.rotateX(Math.PI / 2);
        const lens = new THREE.Mesh(lensGeo, lensMaterial);
        lens.position.set(xPos, 0, 0);
        frameGroup.add(lens);
      });

      // Left & Right Temples (Arms extending backwards past the ears into the occluder)
      const templeLength = 1.35;
      const templeGeo = new THREE.BoxGeometry(0.02, 0.035, templeLength);
      const templeOffset = eyeSeparation + rimRadius;

      // Left Temple
      const leftTemple = new THREE.Mesh(templeGeo, frameMaterial);
      leftTemple.position.set(-templeOffset, 0.02, -templeLength / 2);
      leftTemple.rotation.y = 0.05; // Slight taper toward the back of the head
      frameGroup.add(leftTemple);

      // Right Temple
      const rightTemple = new THREE.Mesh(templeGeo, frameMaterial);
      rightTemple.position.set(templeOffset, 0.02, -templeLength / 2);
      rightTemple.rotation.y = -0.05;
      frameGroup.add(rightTemple);

      // Apply initial scaling and offsets
      frameGroup.scale.setScalar(config.scale);
      frameGroup.position.set(0, config.offsetY, config.offsetZ);

      glassesContainer.add(frameGroup);
    }

    // 3. MediaPipe FaceLandmarker Initialization
    async function initMediaPipe() {
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        outputFacialTransformationMatrixes: true,
        numFaces: 1
      });

      await startCamera();
    }

    // 4. Start Front Webcam
    async function startCamera() {
      video = document.getElementById("webcam");
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: "user"
        },
        audio: false
      });

      video.srcObject = stream;
      video.onloadedmetadata = () => {
        video.play();
        loaderElem.style.opacity = "0";
        setTimeout(() => (loaderElem.style.display = "none"), 500);
        requestAnimationFrame(renderLoop);
      };
    }

    // 5. 6DoF Pose & Real-Time Tracking Loop
    let lastVideoTime = -1;
    const rawMatrix = new THREE.Matrix4();
    const mirrorMatrix = new THREE.Matrix4().makeScale(-1, 1, 1); // Aligns mirrored video feed

    function renderLoop() {
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        if (results.facialTransformationMatrixes && results.facialTransformationMatrixes.length > 0) {
          const matrixData = results.facialTransformationMatrixes[0].data;
          rawMatrix.fromArray(matrixData);

          // Convert MediaPipe matrix format (Right-Handed Metric) to Three.js coordinates
          // Invert vertical axes and mirror X to align with the flipped selfie camera
          const targetMatrix = new THREE.Matrix4();
          targetMatrix.copy(rawMatrix);
          targetMatrix.multiplyMatrices(mirrorMatrix, targetMatrix);

          const pos = new THREE.Vector3();
          const quat = new THREE.Quaternion();
          const scale = new THREE.Vector3();
          targetMatrix.decompose(pos, quat, scale);

          // Scale centimeters to 3D world space
          pos.multiplyScalar(0.08);

          // Smooth transformations using Lerp/Slerp to absorb webcam frame-rate jitter
          if (firstDetection) {
            smoothPos.copy(pos);
            smoothQuat.copy(quat);
            smoothScale.copy(scale);
            firstDetection = false;
          } else {
            smoothPos.lerp(pos, 0.4);
            smoothQuat.slerp(quat, 0.4);
            smoothScale.lerp(scale, 0.4);
          }

          headGroup.position.copy(smoothPos);
          headGroup.quaternion.copy(smoothQuat);
          headGroup.visible = true;
        } else {
          // If face is temporarily obscured, conceal the eyewear
          headGroup.visible = false;
          firstDetection = true;
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(renderLoop);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // 6. UI Controls & Switcher Dock
    function setupControls() {
      const dock = document.getElementById("dock");

      // Generate buttons dynamically
      GLASSES_MODELS.forEach((model, index) => {
        const btn = document.createElement("button");
        btn.className = `selector-btn ${index === 0 ? "active" : ""}`;
        btn.innerText = model.name;
        btn.onclick = () => {
          document.querySelectorAll(".selector-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentConfig = model;
          buildEyewear(model);
        };
        dock.insertBefore(btn, dock.lastElementChild);
      });

      // Snapshot Compositing (Combines mirrored webcam frame + 3D Three.js canvas)
      document.getElementById("snapshot").onclick = () => {
        const snapCanvas = document.createElement("canvas");
        snapCanvas.width = video.videoWidth;
        snapCanvas.height = video.videoHeight;
        const ctx = snapCanvas.getContext("2d");

        // 1. Draw mirrored video
        ctx.save();
        ctx.translate(snapCanvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
        ctx.restore();

        // 2. Draw 3D overlay
        const threeCanvas = document.getElementById("three-canvas");
        ctx.drawImage(threeCanvas, 0, 0, snapCanvas.width, snapCanvas.height);

        // 3. Trigger PNG download
        const link = document.createElement("a");
        link.download = `tryon-${Date.now()}.png`;
        link.href = snapCanvas.toDataURL("image/png");
        link.click();
      };
    }

    window.onload = async () => {
      initScene();
      setupControls();
      await initMediaPipe();
    };
  </script>
</head>
<body>
  <div id="loader-overlay">
    <div class="spinner"></div>
    <p>Calibrating 3D Camera & Head Occlusion Mesh...</p>
  </div>

  <div id="viewport">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="three-canvas"></canvas>

    <nav id="dock">
      <!-- Buttons dynamically populated here -->
      <button class="snapshot-btn" id="snapshot" title="Save Snapshot">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>
    </nav>
  </div>
</body>
</html>
