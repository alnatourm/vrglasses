<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Glasses Try-On</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #vto-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #loader {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 14, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
      gap: 16px;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-text {
      font-size: 0.95rem;
      color: #94a3b8;
    }
    #dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      background: rgba(20, 24, 33, 0.85);
      backdrop-filter: blur(14px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
    }
    .btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
    }
    .snapshot-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #10b981;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10";

    const CATALOG = [
      { id: "classic-black", name: "Wayfarer Black", frameColor: 0x18181b, lensColor: 0x0f172a, metalness: 0.1, roughness: 0.2, style: "square" },
      { id: "aviator-gold", name: "Aviator Gold", frameColor: 0xd4af37, lensColor: 0x142b1e, metalness: 0.85, roughness: 0.08, style: "aviator" },
      { id: "amber-round", name: "Amber Round", frameColor: 0x7c3f16, lensColor: 0x3d200e, metalness: 0.05, roughness: 0.25, style: "round" }
    ];

    let currentConfig = CATALOG[0];
    let faceLandmarker, video, scene, camera, renderer;
    let glassesContainer;
    const loaderElem = document.getElementById("loader");

    const smoothPos = new THREE.Vector3();
    const smoothQuat = new THREE.Quaternion();
    let smoothScale = 1.0;
    let isFirst = true;

    function initThree() {
      const canvas = document.getElementById("three-canvas");
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 3.5);

      renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 1.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
      dirLight.position.set(1.5, 3, 3);
      scene.add(dirLight);

      glassesContainer = new THREE.Group();
      scene.add(glassesContainer);

      buildEyewear(currentConfig);
      window.addEventListener("resize", onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function buildEyewear(cfg) {
      while (glassesContainer.children.length) {
        glassesContainer.remove(glassesContainer.children[0]);
      }

      const root = new THREE.Group();

      const frameMat = new THREE.MeshStandardMaterial({
        color: cfg.frameColor,
        metalness: cfg.metalness,
        roughness: cfg.roughness
      });

      const lensMat = new THREE.MeshPhysicalMaterial({
        color: cfg.lensColor,
        metalness: 0,
        roughness: 0.05,
        transmission: 0.85,
        transparent: true,
        opacity: 0.75,
        depthWrite: false
      });

      const eyeSep = 0.36;
      const rimRadius = 0.23;
      const rimThickness = 0.022;

      // Central Nose Bridge
      const bridgeGeo = new THREE.CylinderGeometry(rimThickness * 0.7, rimThickness * 0.7, eyeSep * 0.85, 16);
      bridgeGeo.rotateZ(Math.PI / 2);
      const bridge = new THREE.Mesh(bridgeGeo, frameMat);
      root.add(bridge);

      if (cfg.style === "aviator") {
        const topBar = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.014, 0.016), frameMat);
        topBar.position.set(0, 0.12, 0);
        root.add(topBar);
      }

      // Left & Right Lenses and Rims
      [-eyeSep, eyeSep].forEach((x) => {
        let rimGeo, lensGeo;

        if (cfg.style === "aviator") {
          rimGeo = new THREE.TorusGeometry(rimRadius, 0.016, 12, 36);
          lensGeo = new THREE.CircleGeometry(rimRadius * 0.95, 32);
        } else if (cfg.style === "square") {
          rimGeo = new THREE.TorusGeometry(rimRadius, rimThickness, 14, 36);
          lensGeo = new THREE.CircleGeometry(rimRadius * 0.95, 32);
        } else {
          rimGeo = new THREE.TorusGeometry(rimRadius, rimThickness, 16, 40);
          lensGeo = new THREE.CircleGeometry(rimRadius * 0.95, 36);
        }

        const rim = new THREE.Mesh(rimGeo, frameMat);
        if (cfg.style === "aviator") rim.scale.set(1.05, 1.25, 1);
        if (cfg.style === "square") rim.scale.set(1.15, 0.95, 1);
        rim.position.set(x, 0, 0);
        root.add(rim);

        const lens = new THREE.Mesh(lensGeo, lensMat);
        if (cfg.style === "aviator") lens.scale.set(1.05, 1.25, 1);
        if (cfg.style === "square") lens.scale.set(1.15, 0.95, 1);
        lens.position.set(x, 0, 0.002);
        root.add(lens);
      });

      // Frame Temples: +Z reaches backwards toward the ears
      const armLen = 1.45;
      const armGeo = new THREE.BoxGeometry(0.016, 0.024, armLen);
      const armOffset = eyeSep + rimRadius;

      // Left Arm
      const leftArm = new THREE.Mesh(armGeo, frameMat);
      leftArm.position.set(-armOffset, -0.02, armLen / 2);
      leftArm.rotation.y = -0.04;
      root.add(leftArm);

      // Right Arm
      const rightArm = new THREE.Mesh(armGeo, frameMat);
      rightArm.position.set(armOffset, -0.02, armLen / 2);
      rightArm.rotation.y = 0.04;
      root.add(rightArm);

      glassesContainer.add(root);
    }

    async function initMediaPipe() {
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });

      await startCamera();
    }

    async function startCamera() {
      video = document.getElementById("webcam");
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      video.onloadeddata = () => {
        video.play();
        loaderElem.style.opacity = "0";
        setTimeout(() => (loaderElem.style.display = "none"), 300);
        requestAnimationFrame(renderLoop);
      };
    }

    let lastVideoTime = -1;

    function renderLoop() {
      if (video && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          const lms = results.faceLandmarks[0];

          // Key Landmarks
          const pBridge = lms[168];     // Saddle of nose between eyes
          const pLeftEye = lms[33];      // Left eye outer corner
          const pRightEye = lms[263];    // Right eye outer corner
          const pForehead = lms[10];     // Forehead

          // Perspective Viewport Space
          const zCam = 3.5;
          const vFOV = THREE.MathUtils.degToRad(camera.fov);
          const visibleHeight = 2 * Math.tan(vFOV / 2) * zCam;
          const visibleWidth = visibleHeight * camera.aspect;

          const targetX = -(pBridge.x - 0.5) * visibleWidth;
          const targetY = -(pBridge.y - 0.5) * visibleHeight - 0.02; 
          const targetZ = zCam - 3.5 - (pBridge.z * 1.5) + 0.04;

          // Basis Vectors
          const vecX = new THREE.Vector3(
            -(pRightEye.x - pLeftEye.x) * visibleWidth,
            -(pRightEye.y - pLeftEye.y) * visibleHeight,
            -(pRightEye.z - pLeftEye.z) * 2.0
          ).normalize();

          const vecY = new THREE.Vector3(
            -(pForehead.x - pBridge.x) * visibleWidth,
            -(pForehead.y - pBridge.y) * visibleHeight,
            -(pForehead.z - pBridge.z) * 2.0
          ).normalize();

          // Invert Z so it points back toward the ears
          const vecZ = new THREE.Vector3().crossVectors(vecX, vecY).normalize().negate();
          const correctedY = new THREE.Vector3().crossVectors(vecZ, vecX).normalize();

          const rotMatrix = new THREE.Matrix4().makeBasis(vecX, correctedY, vecZ);
          const targetQuat = new THREE.Quaternion().setFromRotationMatrix(rotMatrix);

          // Scaling
          const eyeSpan = Math.hypot(
            (pRightEye.x - pLeftEye.x) * visibleWidth,
            (pRightEye.y - pLeftEye.y) * visibleHeight
          );
          const targetScale = eyeSpan * 0.95;

          if (isFirst) {
            smoothPos.set(targetX, targetY, targetZ);
            smoothQuat.copy(targetQuat);
            smoothScale = targetScale;
            isFirst = false;
          } else {
            smoothPos.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.5);
            smoothQuat.slerp(targetQuat, 0.55);
            smoothScale += (targetScale - smoothScale) * 0.45;
          }

          glassesContainer.position.copy(smoothPos);
          glassesContainer.quaternion.copy(smoothQuat);
          glassesContainer.scale.setScalar(smoothScale);
          glassesContainer.visible = true;
        } else {
          glassesContainer.visible = false;
          isFirst = true;
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(renderLoop);
    }

    function setupControls() {
      const dock = document.getElementById("dock");
      CATALOG.forEach((m, i) => {
        const btn = document.createElement("button");
        btn.className = `btn ${i === 0 ? "active" : ""}`;
        btn.innerText = m.name;
        btn.onclick = () => {
          document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentConfig = m;
          buildEyewear(m);
        };
        dock.insertBefore(btn, dock.lastElementChild);
      });

      document.getElementById("snapshot").onclick = () => {
        if (!video?.videoWidth) return;
        const snap = document.createElement("canvas");
        snap.width = video.videoWidth;
        snap.height = video.videoHeight;
        const ctx = snap.getContext("2d");

        ctx.save();
        ctx.translate(snap.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0);
        ctx.restore();

        const threeCanvas = document.getElementById("three-canvas");
        ctx.drawImage(threeCanvas, 0, 0, snap.width, snap.height);

        const link = document.createElement("a");
        link.download = `glasses-${Date.now()}.png`;
        link.href = snap.toDataURL("image/png");
        link.click();
      };
    }

    window.onload = async () => {
      initThree();
      setupControls();
      await initMediaPipe();
    };
  </script>
</head>
<body>
  <div id="vto-root">
    <div id="loader">
      <div class="spinner"></div>
      <p id="loader-text">Calibrating 3D Pose...</p>
    </div>

    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="three-canvas"></canvas>

    <nav id="dock">
      <button class="snapshot-btn" id="snapshot" title="Save Photo">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>
    </nav>
  </div>
</body>
</html>
