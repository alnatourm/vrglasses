<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Real Glasses Try-On</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #vto-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #loader {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 14, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
      gap: 16px;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-text {
      font-size: 0.95rem;
      color: #94a3b8;
    }
    #dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(20, 24, 33, 0.85);
      backdrop-filter: blur(14px);
      padding: 8px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .snapshot-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #10b981;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #file-input {
      display: none;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10";

    // Auto-loads 'glasses.png' from your repo if present, or allows tap-to-upload
    const DEFAULT_IMAGE_PATH = "glasses.png";

    let faceLandmarker, video, scene, camera, renderer;
    let headGroup, occluderMesh, glassesContainer;
    let leftArmMesh, rightArmMesh;
    const loaderElem = document.getElementById("loader");

    const smoothPos = new THREE.Vector3();
    const smoothQuat = new THREE.Quaternion();
    let isFirst = true;

    function initThree() {
      const canvas = document.getElementById("three-canvas");
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 2.0));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
      dirLight.position.set(1.5, 3, 2.5);
      scene.add(dirLight);

      headGroup = new THREE.Group();
      scene.add(headGroup);

      // Anatomical occluder (placed back behind eyes to hide temple arms behind ears)
      const occluderGeo = new THREE.SphereGeometry(0.82, 32, 24);
      occluderGeo.scale(0.85, 1.12, 1.05);
      const occluderMat = new THREE.MeshBasicMaterial({
        colorWrite: false,
        depthWrite: true
      });
      occluderMesh = new THREE.Mesh(occluderGeo, occluderMat);
      occluderMesh.position.set(0, -0.05, -0.62);
      occluderMesh.renderOrder = 0;
      headGroup.add(occluderMesh);

      glassesContainer = new THREE.Group();
      glassesContainer.renderOrder = 1;
      headGroup.add(glassesContainer);

      window.addEventListener("resize", onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // -------------------------------------------------------------
    // SAFE BACKGROUND REMOVER
    // Flood-fills from the 4 outer corners only, protecting the bridge!
    // -------------------------------------------------------------
    function cleanStudioBackgroundSafely(img) {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth || img.width;
      c.height = img.naturalHeight || img.height;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0);

      const w = c.width;
      const h = c.height;
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // Flood-fill alpha from the border pixels ONLY
      // This guarantees the internal bridge and frame plastic never get deleted
      const visited = new Uint8Array(w * h);
      const queue = [];

      function isWhiteOrNearWhite(idx) {
        return data[idx] > 230 && data[idx + 1] > 230 && data[idx + 2] > 230;
      }

      // Seed borders
      for (let x = 0; x < w; x++) {
        queue.push([x, 0]);
        queue.push([x, h - 1]);
      }
      for (let y = 0; y < h; y++) {
        queue.push([0, y]);
        queue.push([w - 1, y]);
      }

      while (queue.length > 0) {
        const [cx, cy] = queue.pop();
        if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;

        const pIdx = cy * w + cx;
        if (visited[pIdx]) continue;
        visited[pIdx] = 1;

        const dIdx = pIdx * 4;
        if (isWhiteOrNearWhite(dIdx)) {
          data[dIdx + 3] = 0; // Make transparent
          queue.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
        }
      }

      ctx.putImageData(imgData, 0, 0);
      return c;
    }

    function applyRealGlasses(processedCanvas) {
      while (glassesContainer.children.length) {
        glassesContainer.remove(glassesContainer.children[0]);
      }

      const texture = new THREE.CanvasTexture(processedCanvas);
      texture.generateMipmaps = true;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;

      const imgAspect = processedCanvas.width / processedCanvas.height;
      const frameWidth = 0.96; // Calibrated pupillary span
      const frameHeight = frameWidth / imgAspect;

      const root = new THREE.Group();

      // Front Photographic Frame (Slightly curved geometry for natural wrap)
      const planeGeo = new THREE.PlaneGeometry(frameWidth, frameHeight, 16, 1);
      
      // Apply a subtle cylindrical facial curve to the plane
      const pos = planeGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const zCurve = -Math.pow(x / (frameWidth / 2), 2) * 0.04;
        pos.setZ(i, zCurve);
      }
      planeGeo.computeVertexNormals();

      const planeMat = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        alphaTest: 0.05,
        side: THREE.DoubleSide
      });

      const frameMesh = new THREE.Mesh(planeGeo, planeMat);
      root.add(frameMesh);

      // Real 3D Temples extending from the outer lug corners
      const armMat = new THREE.MeshStandardMaterial({
        color: 0x18181b,
        roughness: 0.25,
        metalness: 0.1
      });

      const armLen = 1.55;
      const armGeo = new THREE.BoxGeometry(0.015, 0.024, armLen);
      armGeo.translate(0, 0, -armLen / 2);

      const armOffsetX = (frameWidth / 2) * 0.94;
      const armOffsetY = (frameHeight / 2) * 0.40;

      // Left Temple
      leftArmMesh = new THREE.Mesh(armGeo, armMat);
      leftArmMesh.position.set(-armOffsetX, armOffsetY, 0);
      leftArmMesh.rotation.x = -0.055;
      leftArmMesh.rotation.y = 0.07;
      root.add(leftArmMesh);

      // Right Temple
      rightArmMesh = new THREE.Mesh(armGeo, armMat);
      rightArmMesh.position.set(armOffsetX, armOffsetY, 0);
      rightArmMesh.rotation.x = -0.055;
      rightArmMesh.rotation.y = -0.07;
      root.add(rightArmMesh);

      // Centered exactly over the nose bridge and pupils
      root.position.set(0, 0.005, 0.22);
      glassesContainer.add(root);
    }

    function loadGlassesFromUrl(url) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const cleaned = cleanStudioBackgroundSafely(img);
        applyRealGlasses(cleaned);
      };
      img.onerror = () => {
        // Fallback procedural visualizer if image is not yet uploaded
        console.warn("Could not find glasses.png. Tap 'Upload Glasses' to choose your image.");
      };
      img.src = url;
    }

    async function initMediaPipe() {
      const fileset = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        outputFacialTransformationMatrixes: true,
        numFaces: 1
      });

      await startCamera();
    }

    async function startCamera() {
      video = document.getElementById("webcam");
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      video.onloadeddata = () => {
        video.play();
        loaderElem.style.opacity = "0";
        setTimeout(() => (loaderElem.style.display = "none"), 300);
        requestAnimationFrame(renderLoop);
      };
    }

    let lastVideoTime = -1;
    const rawMatrix = new THREE.Matrix4();
    const mirrorMatrix = new THREE.Matrix4().makeScale(-1, 1, 1);
    const tmpPos = new THREE.Vector3();
    const tmpQuat = new THREE.Quaternion();
    const tmpScale = new THREE.Vector3();
    const euler = new THREE.Euler(0, 0, 0, "YXZ");

    function renderLoop() {
      if (video && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        if (results.facialTransformationMatrixes && results.facialTransformationMatrixes.length > 0) {
          const matrixData = results.facialTransformationMatrixes[0].data;
          rawMatrix.fromArray(matrixData);

          const targetMatrix = new THREE.Matrix4();
          targetMatrix.copy(rawMatrix);
          targetMatrix.multiplyMatrices(mirrorMatrix, targetMatrix);
          targetMatrix.decompose(tmpPos, tmpQuat, tmpScale);

          tmpPos.multiplyScalar(0.08);

          if (isFirst) {
            smoothPos.copy(tmpPos);
            smoothQuat.copy(tmpQuat);
            isFirst = false;
          } else {
            smoothPos.lerp(tmpPos, 0.45);
            smoothQuat.slerp(tmpQuat, 0.5);
          }

          headGroup.position.copy(smoothPos);
          headGroup.quaternion.copy(smoothQuat);

          // Culls far temple arm during rotation
          euler.setFromQuaternion(smoothQuat, "YXZ");
          const yaw = euler.y;
          if (leftArmMesh && rightArmMesh) {
            leftArmMesh.visible = yaw > -0.32;
            rightArmMesh.visible = yaw < 0.32;
          }

          headGroup.visible = true;
        } else {
          headGroup.visible = false;
          isFirst = true;
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(renderLoop);
    }

    function setupControls() {
      const fileInput = document.getElementById("file-input");
      const uploadBtn = document.getElementById("upload-btn");

      uploadBtn.onclick = () => fileInput.click();

      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const cleaned = cleanStudioBackgroundSafely(img);
            applyRealGlasses(cleaned);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };

      document.getElementById("snapshot").onclick = () => {
        if (!video?.videoWidth) return;
        const snap = document.createElement("canvas");
        snap.width = video.videoWidth;
        snap.height = video.videoHeight;
        const ctx = snap.getContext("2d");

        ctx.save();
        ctx.translate(snap.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0);
        ctx.restore();

        const threeCanvas = document.getElementById("three-canvas");
        ctx.drawImage(threeCanvas, 0, 0, snap.width, snap.height);

        const link = document.createElement("a");
        link.download = `glasses-${Date.now()}.png`;
        link.href = snap.toDataURL("image/png");
        link.click();
      };
    }

    window.onload = async () => {
      initThree();
      setupControls();
      loadGlassesFromUrl(DEFAULT_IMAGE_PATH);
      await initMediaPipe();
    };
  </script>
</head>
<body>
  <div id="vto-root">
    <div id="loader">
      <div class="spinner"></div>
      <p id="loader-text">Loading Photo Try-On...</p>
    </div>

    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="three-canvas"></canvas>

    <nav id="dock">
      <input type="file" id="file-input" accept="image/*" />
      <button class="btn" id="upload-btn">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Upload Glasses
      </button>

      <button class="snapshot-btn" id="snapshot" title="Save Photo">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>
    </nav>
  </div>
</body>
</html>
