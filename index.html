<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Glasses Try-On</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #vto-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #loader {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 14, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
      gap: 16px;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-text {
      font-size: 0.95rem;
      color: #94a3b8;
    }
    #loader-error {
      font-size: 0.85rem;
      color: #f87171;
      text-align: center;
      max-width: 80vw;
      display: none;
    }
    #retry-btn {
      display: none;
      background: #3b82f6;
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      background: rgba(20, 24, 33, 0.85);
      backdrop-filter: blur(14px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
    }
    .btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
    }
    .snapshot-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #10b981;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #debug-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(20, 24, 33, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fbbf24;
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 14px;
      cursor: pointer;
    }
    #debug-btn.active {
      background: #f59e0b;
      color: #000;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10";

    const CATALOG = [
      { id: "classic-black", name: "Wayfarer Black", frameColor: 0x18181b, lensColor: 0x0f172a, metalness: 0.1, roughness: 0.2, style: "square" },
      { id: "aviator-gold", name: "Aviator Gold", frameColor: 0xd4af37, lensColor: 0x142b1e, metalness: 0.85, roughness: 0.08, style: "aviator" },
      { id: "amber-round", name: "Amber Round", frameColor: 0x7c3f16, lensColor: 0x3d200e, metalness: 0.05, roughness: 0.25, style: "round" }
    ];

    // --- Calibration constants, all in one place so you can tune without hunting ---
    // POSITION_SCALE maps MediaPipe's transformation-matrix translation units to
    // Three.js world units. This was previously an unverified guess (0.08). Use
    // debug mode (top-right button) to check: the magenta box should sit exactly
    // on the bridge of the nose. If it's off-center or floating away from the
    // face, adjust this number up/down and retest — don't touch geometry offsets
    // until this is correct, since geometry sits relative to this anchor.
    const POSITION_SCALE = 0.08;

    // Vertical offset (in the SAME scaled units as head position) to drop the
    // glasses geometry down from the tracked anchor point onto the nose bridge.
    // Increase magnitude (more negative) if frames still sit on the eyebrows.
    const GLASSES_DROP_Y = -0.14;

    // Forward offset so the glasses float just off the skin instead of clipping into it.
    const GLASSES_FORWARD_Z = 0.22;

    let currentConfig = CATALOG[0];
    let faceLandmarker, video, scene, camera, renderer;
    let headGroup, occluderMesh, glassesContainer, debugAnchor;
    let debugMode = false;
    const loaderElem = document.getElementById("loader");
    const loaderText = document.getElementById("loader-text");
    const loaderError = document.getElementById("loader-error");
    const retryBtn = document.getElementById("retry-btn");
    const spinner = document.querySelector(".spinner");

    const smoothPos = new THREE.Vector3();
    const smoothQuat = new THREE.Quaternion();
    let isFirst = true;

    function initThree() {
      const canvas = document.getElementById("three-canvas");
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 1.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight.position.set(1.5, 3, 2.5);
      scene.add(dirLight);

      headGroup = new THREE.Group();
      scene.add(headGroup);

      // Occluder: hides temple arms behind the head. In debug mode we make it
      // visible (magenta) so you can see exactly where the tracker thinks the
      // head anchor is relative to your actual face.
      const occluderGeo = new THREE.BoxGeometry(1.6, 1.8, 0.8);
      const occluderMat = new THREE.MeshBasicMaterial({
        colorWrite: false,
        depthWrite: true
      });
      occluderMesh = new THREE.Mesh(occluderGeo, occluderMat);
      occluderMesh.position.set(0, 0, -0.9);
      occluderMesh.renderOrder = 0;
      headGroup.add(occluderMesh);

      // Small bright marker exactly at the head anchor (nose bridge, per
      // MediaPipe's canonical face model) — only visible in debug mode.
      const anchorGeo = new THREE.SphereGeometry(0.04, 16, 16);
      const anchorMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });
      debugAnchor = new THREE.Mesh(anchorGeo, anchorMat);
      debugAnchor.visible = false;
      headGroup.add(debugAnchor);

      glassesContainer = new THREE.Group();
      glassesContainer.renderOrder = 1;
      headGroup.add(glassesContainer);

      buildEyewear(currentConfig);
      window.addEventListener("resize", onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function buildEyewear(cfg) {
      while (glassesContainer.children.length) {
        glassesContainer.remove(glassesContainer.children[0]);
      }

      const root = new THREE.Group();

      const frameMat = new THREE.MeshStandardMaterial({
        color: cfg.frameColor,
        metalness: cfg.metalness,
        roughness: cfg.roughness
      });

      const lensMat = new THREE.MeshPhysicalMaterial({
        color: cfg.lensColor,
        metalness: 0,
        roughness: 0.05,
        transmission: 0.85,
        transparent: true,
        opacity: 0.72,
        depthWrite: false
      });

      const eyeSep = 0.34;
      const rimRadius = 0.215;
      const rimThickness = 0.02;

      const bridgeGeo = new THREE.CylinderGeometry(rimThickness * 0.7, rimThickness * 0.7, eyeSep * 0.75, 16);
      bridgeGeo.rotateZ(Math.PI / 2);
      const bridge = new THREE.Mesh(bridgeGeo, frameMat);
      bridge.position.set(0, 0.045, 0);
      root.add(bridge);

      if (cfg.style === "aviator") {
        const topBar = new THREE.Mesh(new THREE.BoxGeometry(eyeSep * 2 + rimRadius, 0.012, 0.014), frameMat);
        topBar.position.set(0, 0.11, 0);
        root.add(topBar);
      }

      [-eyeSep, eyeSep].forEach((x) => {
        let rimGeo, lensGeo;

        if (cfg.style === "aviator") {
          rimGeo = new THREE.TorusGeometry(rimRadius, 0.014, 12, 36);
          lensGeo = new THREE.CircleGeometry(rimRadius * 0.95, 32);
        } else if (cfg.style === "square") {
          rimGeo = new THREE.TorusGeometry(rimRadius, rimThickness, 14, 36);
          lensGeo = new THREE.CircleGeometry(rimRadius * 0.95, 32);
        } else {
          rimGeo = new THREE.TorusGeometry(rimRadius, rimThickness, 16, 40);
          lensGeo = new THREE.CircleGeometry(rimRadius * 0.95, 36);
        }

        const rim = new THREE.Mesh(rimGeo, frameMat);
        if (cfg.style === "aviator") rim.scale.set(1.05, 1.22, 1);
        if (cfg.style === "square") rim.scale.set(1.15, 0.92, 1);
        rim.position.set(x, 0, 0);
        root.add(rim);

        const lens = new THREE.Mesh(lensGeo, lensMat);
        if (cfg.style === "aviator") lens.scale.set(1.05, 1.22, 1);
        if (cfg.style === "square") lens.scale.set(1.15, 0.92, 1);
        lens.position.set(x, 0, 0.002);
        root.add(lens);
      });

      const armLen = 1.42;
      const armGeo = new THREE.BoxGeometry(0.014, 0.022, armLen);
      const armOffsetX = eyeSep + rimRadius;
      const armOffsetY = 0.045;

      const leftArm = new THREE.Mesh(armGeo, frameMat);
      leftArm.position.set(-armOffsetX, armOffsetY, -armLen / 2);
      leftArm.rotation.x = -0.06;
      leftArm.rotation.y = 0.03;
      root.add(leftArm);

      const rightArm = new THREE.Mesh(armGeo, frameMat);
      rightArm.position.set(armOffsetX, armOffsetY, -armLen / 2);
      rightArm.rotation.x = -0.06;
      rightArm.rotation.y = -0.03;
      root.add(rightArm);

      root.position.set(0, GLASSES_DROP_Y, GLASSES_FORWARD_Z);
      glassesContainer.add(root);
    }

    function showError(msg) {
      spinner.style.display = "none";
      loaderText.style.display = "none";
      loaderError.textContent = msg;
      loaderError.style.display = "block";
      retryBtn.style.display = "inline-block";
    }

    async function initMediaPipe() {
      try {
        const fileset = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10/wasm"
        );

        try {
          faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
            baseOptions: {
              modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate: "GPU"
            },
            runningMode: "VIDEO",
            outputFacialTransformationMatrixes: true,
            numFaces: 1
          });
        } catch (gpuErr) {
          // Fall back to CPU delegate — common on older/unsupported GPUs
          faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
            baseOptions: {
              modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate: "CPU"
            },
            runningMode: "VIDEO",
            outputFacialTransformationMatrixes: true,
            numFaces: 1
          });
        }

        await startCamera();
      } catch (err) {
        console.error(err);
        if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
          showError("Camera access was denied. Please allow camera permission and retry.");
        } else if (err.name === "NotFoundError") {
          showError("No camera was found on this device.");
        } else {
          showError("Couldn't start the try-on experience. Please retry.");
        }
      }
    }

    async function startCamera() {
      video = document.getElementById("webcam");
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      video.onloadeddata = () => {
        video.play();
        loaderElem.style.opacity = "0";
        setTimeout(() => (loaderElem.style.display = "none"), 300);
        requestAnimationFrame(renderLoop);
      };
    }

    let lastVideoTime = -1;
    const rawMatrix = new THREE.Matrix4();
    const tmpPos = new THREE.Vector3();
    const tmpQuat = new THREE.Quaternion();
    const tmpScale = new THREE.Vector3();

    function renderLoop() {
      if (video && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        if (results.facialTransformationMatrixes && results.facialTransformationMatrixes.length > 0) {
          const matrixData = results.facialTransformationMatrixes[0].data;
          rawMatrix.fromArray(matrixData);

          // Decompose FIRST, then mirror position/rotation directly.
          // Mirroring about the X axis: negate position.x, and negate the
          // y and z components of the quaternion (leaves x and w untouched).
          // This is the correct way to mirror a rigid transform — a naive
          // matrix pre-multiply by a reflection matrix produces an improper
          // rotation that decompose() silently "fixes" into the WRONG
          // rotation, which is why yaw tracking broke on profile turns.
          rawMatrix.decompose(tmpPos, tmpQuat, tmpScale);

          tmpPos.x *= -1;
          tmpQuat.y *= -1;
          tmpQuat.z *= -1;

          tmpPos.multiplyScalar(POSITION_SCALE);

          if (isFirst) {
            smoothPos.copy(tmpPos);
            smoothQuat.copy(tmpQuat);
            isFirst = false;
          } else {
            smoothPos.lerp(tmpPos, 0.45);
            smoothQuat.slerp(tmpQuat, 0.5);
          }

          headGroup.position.copy(smoothPos);
          headGroup.quaternion.copy(smoothQuat);
          headGroup.visible = true;
        } else {
          headGroup.visible = false;
          isFirst = true;
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(renderLoop);
    }

    function setupControls() {
      const dock = document.getElementById("dock");
      CATALOG.forEach((m, i) => {
        const btn = document.createElement("button");
        btn.className = `btn ${i === 0 ? "active" : ""}`;
        btn.innerText = m.name;
        btn.onclick = () => {
          document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentConfig = m;
          buildEyewear(m);
        };
        dock.insertBefore(btn, dock.lastElementChild);
      });

      document.getElementById("snapshot").onclick = () => {
        if (!video?.videoWidth) return;

        const w = window.innerWidth, h = window.innerHeight;
        const snap = document.createElement("canvas");
        snap.width = w;
        snap.height = h;
        const ctx = snap.getContext("2d");

        // Replicate object-fit: cover cropping so the snapshot matches what
        // was actually visible on screen (raw video dims != viewport dims).
        const vAspect = video.videoWidth / video.videoHeight;
        const cAspect = w / h;
        let sx, sy, sw, sh;
        if (vAspect > cAspect) {
          sh = video.videoHeight;
          sw = sh * cAspect;
          sx = (video.videoWidth - sw) / 2;
          sy = 0;
        } else {
          sw = video.videoWidth;
          sh = sw / cAspect;
          sx = 0;
          sy = (video.videoHeight - sh) / 2;
        }

        ctx.save();
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
        ctx.restore();

        const threeCanvas = document.getElementById("three-canvas");
        ctx.drawImage(threeCanvas, 0, 0, w, h);

        const link = document.createElement("a");
        link.download = `glasses-${Date.now()}.png`;
        link.href = snap.toDataURL("image/png");
        link.click();
      };

      const debugBtn = document.getElementById("debug-btn");
      debugBtn.onclick = () => {
        debugMode = !debugMode;
        debugBtn.classList.toggle("active", debugMode);
        debugAnchor.visible = debugMode;
        // Make the occluder visible (bright, translucent) so you can see the
        // tracked head volume against your real face for calibration.
        occluderMesh.material.colorWrite = debugMode;
        occluderMesh.material.color.set(0x00ffff);
        occluderMesh.material.transparent = true;
        occluderMesh.material.opacity = debugMode ? 0.25 : 1;
      };

      retryBtn.onclick = () => {
        loaderError.style.display = "none";
        retryBtn.style.display = "none";
        loaderText.style.display = "block";
        loaderText.textContent = "Retrying...";
        spinner.style.display = "block";
        loaderElem.style.display = "flex";
        loaderElem.style.opacity = "1";
        initMediaPipe();
      };
    }

    window.onload = async () => {
      initThree();
      setupControls();
      await initMediaPipe();
    };
  </script>
</head>
<body>
  <div id="vto-root">
    <div id="loader">
      <div class="spinner"></div>
      <p id="loader-text">Loading 3D Optics...</p>
      <p id="loader-error"></p>
      <button id="retry-btn">Retry</button>
    </div>

    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="three-canvas"></canvas>

    <button id="debug-btn" title="Toggle calibration debug view">Debug</button>

    <nav id="dock">
      <button class="snapshot-btn" id="snapshot" title="Save Photo">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>
    </nav>
  </div>
</body>
</html>
