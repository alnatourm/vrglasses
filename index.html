<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Glasses Try-On</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #loader {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 12, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      gap: 16px;
      transition: opacity 0.3s;
    }
    .spin {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: s 0.8s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
    #dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      background: rgba(24, 24, 27, 0.8);
      backdrop-filter: blur(14px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.82rem;
      padding: 7px 15px;
      border-radius: 20px;
      cursor: pointer;
    }
    .btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10";

    const MODELS = [
      { id: "black", name: "Black Wayfarer", frame: 0x18181b, lens: 0x0f172a, style: "square" },
      { id: "gold", name: "Gold Aviator", frame: 0xd4af37, lens: 0x1a2e1a, style: "aviator" },
      { id: "amber", name: "Amber Round", frame: 0x7c3f16, lens: 0x3d200e, style: "round" }
    ];

    let currentModel = MODELS[0];
    let faceLandmarker, video, scene, camera, renderer;
    let glassesGroup;
    const loader = document.getElementById("loader");

    // Smoothing vectors
    const sPos = new THREE.Vector3();
    const sQuat = new THREE.Quaternion();
    let sScale = 1.0;
    let first = true;

    function initThree() {
      const canvas = document.getElementById("three-canvas");
      scene = new THREE.Scene();

      // Orthographic/matching perspective camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 3.5);

      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 1.6));
      const light = new THREE.DirectionalLight(0xffffff, 1.8);
      light.position.set(1, 2, 3);
      scene.add(light);

      glassesGroup = new THREE.Group();
      scene.add(glassesGroup);

      buildFrames(currentModel);
      window.addEventListener("resize", onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function buildFrames(cfg) {
      while (glassesGroup.children.length) {
        glassesGroup.remove(glassesGroup.children[0]);
      }

      const root = new THREE.Group();
      const fMat = new THREE.MeshStandardMaterial({ color: cfg.frame, roughness: 0.2, metalness: cfg.id === "gold" ? 0.8 : 0.1 });
      const lMat = new THREE.MeshPhysicalMaterial({ color: cfg.lens, transmission: 0.85, roughness: 0.05, opacity: 0.75, transparent: true, depthWrite: false });

      const w = 0.55; // Bridge center to side hinge unit
      const r = 0.38; // Lens radius

      // Central Nose Bridge
      const bridge = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.32, 16), fMat);
      bridge.rotation.z = Math.PI / 2;
      bridge.position.set(0, 0, 0);
      root.add(bridge);

      // Top bar for aviators
      if (cfg.style === "aviator") {
        const topBar = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.02, 0.02), fMat);
        topBar.position.set(0, 0.22, 0);
        root.add(topBar);
      }

      [-w, w].forEach((x) => {
        // Frame Rims
        const rim = new THREE.Mesh(new THREE.TorusGeometry(r, 0.028, 16, 40), fMat);
        if (cfg.style === "aviator") rim.scale.set(1.0, 1.2, 1.0);
        if (cfg.style === "square") rim.scale.set(1.15, 0.9, 1.0);
        rim.position.set(x, 0, 0);
        root.add(rim);

        // Lenses
        const lens = new THREE.Mesh(new THREE.CircleGeometry(r * 0.94, 32), lMat);
        if (cfg.style === "aviator") lens.scale.set(1.0, 1.2, 1.0);
        if (cfg.style === "square") lens.scale.set(1.15, 0.9, 1.0);
        lens.position.set(x, 0, 0.002);
        root.add(lens);
      });

      // Side Arms (Temples) extending backward into Z
      const armLen = 2.4;
      const armGeo = new THREE.BoxGeometry(0.025, 0.035, armLen);
      const armOffset = w + r;

      const leftArm = new THREE.Mesh(armGeo, fMat);
      leftArm.position.set(-armOffset, -0.04, -armLen / 2);
      leftArm.rotation.y = 0.05;
      root.add(leftArm);

      const rightArm = new THREE.Mesh(armGeo, fMat);
      rightArm.position.set(armOffset, -0.04, -armLen / 2);
      rightArm.rotation.y = -0.05;
      root.add(rightArm);

      glassesGroup.add(root);
    }

    async function init() {
      initThree();

      const files = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(files, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });

      video = document.getElementById("webcam");
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      video.onloadeddata = () => {
        video.play();
        loader.style.opacity = "0";
        setTimeout(() => loader.style.display = "none", 300);
        requestAnimationFrame(render);
      };

      setupUI();
    }

    let lastTime = -1;

    function render() {
      if (video && video.readyState >= 2 && video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        const res = faceLandmarker.detectForVideo(video, performance.now());

        if (res.faceLandmarks && res.faceLandmarks.length > 0) {
          const lms = res.faceLandmarks[0];

          // 1. Precise Physical Face Anchor Points
          const pBridge = lms[168]; // Saddle of the nose bridge (between eyes)
          const pLeftEye = lms[33];  // Outer left eye corner
          const pRightEye = lms[263];// Outer right eye corner
          const pForehead = lms[10]; // Forehead marker for vertical pitch

          // 2. Compute 3D Screen Coordinates from MediaPipe's normalized space
          // Perspective projection mapped to camera distance (Z = 3.5)
          const zDepth = 3.5;
          const vFOV = THREE.MathUtils.degToRad(camera.fov);
          const visibleHeight = 2 * Math.tan(vFOV / 2) * zDepth;
          const visibleWidth = visibleHeight * camera.aspect;

          // Target position pinned exactly to the nose bridge
          const posX = -(pBridge.x - 0.5) * visibleWidth;
          const posY = -(pBridge.y - 0.5) * visibleHeight;
          const posZ = zDepth - 3.5 - (pBridge.z * 1.8);

          // 3. EstephanoBrusa Orthonormal Vector Orientation
          // Vector X: Exactly along the eye line
          const eyeVec = new THREE.Vector3(
            -(pRightEye.x - pLeftEye.x) * visibleWidth,
            -(pRightEye.y - pLeftEye.y) * visibleHeight,
            -(pRightEye.z - pLeftEye.z) * 2.0
          ).normalize();

          // Vector Y: From bridge up to forehead
          const upVec = new THREE.Vector3(
            -(pForehead.x - pBridge.x) * visibleWidth,
            -(pForehead.y - pBridge.y) * visibleHeight,
            -(pForehead.z - pBridge.z) * 2.0
          ).normalize();

          // Vector Z: Cross product of X and Y (Points out of the face)
          const forwardVec = new THREE.Vector3().crossVectors(eyeVec, upVec).normalize();
          const correctedUp = new THREE.Vector3().crossVectors(forwardVec, eyeVec).normalize();

          // Construct exact rotation matrix
          const rotMatrix = new THREE.Matrix4().makeBasis(eyeVec, correctedUp, forwardVec);
          const targetQuat = new THREE.Quaternion().setFromRotationMatrix(rotMatrix);

          // 4. Physical Eye Distance Scaling
          // Computes real-world pupillary width in Three.js units
          const eyeSpan = Math.hypot(
            (pRightEye.x - pLeftEye.x) * visibleWidth,
            (pRightEye.y - pLeftEye.y) * visibleHeight
          );
          const targetScale = eyeSpan * 0.95;

          // 5. Smoothing
          if (first) {
            sPos.set(posX, posY, posZ);
            sQuat.copy(targetQuat);
            sScale = targetScale;
            first = false;
          } else {
            sPos.lerp(new THREE.Vector3(posX, posY, posZ), 0.5);
            sQuat.slerp(targetQuat, 0.55);
            sScale += (targetScale - sScale) * 0.45;
          }

          glassesGroup.position.copy(sPos);
          glassesGroup.quaternion.copy(sQuat);
          glassesGroup.scale.setScalar(sScale);
          glassesGroup.visible = true;
        } else {
          glassesGroup.visible = false;
          first = true;
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    function setupUI() {
      const dock = document.getElementById("dock");
      MODELS.forEach((m, i) => {
        const btn = document.createElement("button");
        btn.className = `btn ${i === 0 ? "active" : ""}`;
        btn.innerText = m.name;
        btn.onclick = () => {
          document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentModel = m;
          buildFrames(m);
        };
        dock.appendChild(btn);
      });
    }

    window.onload = init;
  </script>
</head>
<body>
  <div id="loader">
    <div class="spin"></div>
    <p>Calibrating Eye Landmarks...</p>
  </div>

  <div id="viewport">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="three-canvas"></canvas>
    <nav id="dock"></nav>
  </div>
</body>
</html>
